<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="top-bar">
            <h1>Student Registration</h1>
            <div class="header-buttons">
                <button class="btn-theme" id="themeBtn">Dark Mode</button>
                <button class="btn-menu" id="menuBtn">&#9776;</button>
            </div>
        </div>

        <nav class="page-nav" id="mainNav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html">Events</a>
            <a href="faq.html">FAQ</a>
            <a href="login.html">Login</a>
            <a href="register.html" class="active">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <form action="login.html" method="get">
        <h2 align="center">Create Account</h2>

        <label for="regName"><strong>Full Name:</strong></label>
        <input type="text" id="regName" placeholder="Enter Full Name" required>

        <label for="regEmail"><strong>Email Address:</strong></label>
        <input type="email" id="regEmail" placeholder="Enter Email" required>

        <label for="regPassword"><strong>Password:</strong></label>
        <input type="password" id="regPassword" placeholder="Create Password" required>

        <label for="regBranch"><strong>Department / Branch:</strong></label>
        <select id="regBranch">
            <option>Computer Engineering (CE)</option>
            <option>Information Technology (IT)</option>
            <option>Electronics & Communication (EC)</option>
            <option>Mechanical Engineering (ME)</option>
            <option>Civil Engineering (CL)</option>
        </select>

        <br><br>
        <div align="center">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>

        <hr>
        <p align="center">
            Already registered? <a href="login.html">Login Here</a>
        </p>
    </form>

    <hr>
    <p align="center">
        <a href="index.html" class="btn">Back to Home</a>
    </p>

    <script src="script.js"></script>
</body>
</html>
