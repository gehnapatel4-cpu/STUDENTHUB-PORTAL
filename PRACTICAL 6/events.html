<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events - Practical 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="top-bar">
            <h1>Campus Events & Directory</h1>
            <div class="header-buttons">
                <button class="btn-theme" id="themeBtn">Dark Mode</button>
                <button class="btn-menu" id="menuBtn">&#9776;</button>
            </div>
        </div>

        <nav class="page-nav" id="mainNav">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="events.html" class="active">Events</a>
            <a href="faq.html">FAQ</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="card">
        <h2>External JSON Data Rendering (Fetch API)</h2>
        <p>Switch views, filter records, search dynamically, and paginate through dataset records loaded via asynchronous Fetch API.</p>

        <div style="display: flex; gap: 10px; margin-bottom: 16px;">
            <button id="tabEvents" class="btn">Campus Events</button>
            <button id="tabStudents" class="btn btn-secondary">Student Directory</button>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;">
            <input type="text" id="searchInput" placeholder="Search title, venue, or name..." style="flex: 2; min-width: 200px;">
            <select id="categoryFilter" style="flex: 1; min-width: 140px;">
                <option value="all">All Categories</option>
            </select>
            <select id="sortBy" style="flex: 1; min-width: 140px;">
                <option value="default">Default Order</option>
            </select>
        </div>

        <div id="resultsInfo" style="font-weight: bold; margin-bottom: 14px;"></div>
        <div id="itemsContainer" class="info-grid"></div>

        <div align="center" style="margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 12px;">
            <button id="prevBtn" class="slider-btn">&larr; Previous</button>
            <span id="pageIndicator" style="font-weight: bold;">Page 1</span>
            <button id="nextBtn" class="slider-btn">Next &rarr;</button>
        </div>
    </div>

    <hr>
    <p align="center">
        <a href="index.html" class="btn">Back to Home</a>
        <a href="dashboard.html" class="btn btn-secondary">Go to Dashboard</a>
    </p>

    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
